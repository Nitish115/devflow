spring:
  application:
    name: devflow-test
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  cache:
    type: simple

jwt:
  secret: dev_secret_key_change_in_production_environment_min_256_bits_length_123456
  expiration: 86400000

app:
  storage:
    local-path: ./target/test-uploads
    max-file-size: 10485760
